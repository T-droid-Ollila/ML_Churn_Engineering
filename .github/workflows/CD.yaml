# We can design pytest to be run on the data is functioning as expected.
# Then run the containrised batch job
# WE can first start with manual trigger , when we receive new incoming data
# we need to read and write permissions to allow this workflow
# to read and write to our repo due to the mounted volume
name: Deploy established CI workflows
on:
  workflow_dispatch:
    inputs:
      data_path:
        description: "Path to the incoming CSV on the runner machine"
        required: true
        default: 'C:\Data\messy_churn_20000.csv'

permissions: write-all
  # Enables to read and write to repo

jobs:
  submit-batch-job:
    runs-on: [self-hosted,windows]
    env:
      DATA_PATH: ${{ inputs.data_path }}
      OUT_DIR: C:\Churn_Engineering\predictions_output
    steps:
      - name: Checkout repository
        # This pull code from repo to actions directory
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          pip install -r requirements.txt pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate data
        run: python -m pytest --dataset-loc="$env:DATA_PATH" tests/data --verbose --disable-warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Docker login
        uses: docker/login-action@v3
        with:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull image
        run: |
          docker pull first
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Submit containerised batch-predict job
        shell: pwsh
        run: |
          docker run --rm `
            --mount "type=bind,source=$($env:DATA_PATH),target=/app/incoming.csv,readonly" `
            --mount "type=bind,source=$($env:OUT_DIR),target=/app/predictions_output" `
            first `
            python churn_src/predict.py `
            /app/artifacts/processed/preprocessor.pkl `
            /app/incoming.csv `
            /app/artifacts/prod_model/model.pkl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Predictions written to $env:OUT_DIR"
