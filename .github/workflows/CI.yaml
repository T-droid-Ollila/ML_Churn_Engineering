name: Establish CI workflows
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, review_requested, synchronize]
    paths:
      - "churn_src/**"
      - "Dockerfile"
  push:
    branches: [main]
    paths:
      - "churn_src/**"
      - "Dockerfile"

concurrency:
  group: prod

env:
  IMAGE_NAME: ollilatd  # This is my docker username

jobs:
  setup-machine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
          cache: 'pip'

 # 1. Cheap checks first, so failures happen before any image work
      - name: code format
        run: |
          pip install -r requirements.txt black flake isort
          isort --check-only churn_src
          black --check-only churn_src
          flake --check-only churn_src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files

      - name: Docker login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tag: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha

      - name: Pull image by SHA tag
        run: docker pull ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag}}

      - name: Smoke test
        run: |
          docker run --rm "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}" python -c "import churn_src; print('ok')"
